name: Compilar SPmusic

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Descomprimir SPmusic
        run: |
          unzip -o SPmusic_1_0_fuente_completa.zip -d proyecto

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Buscar proyecto
        run: |
          echo "===== CONTENIDO DEL PROYECTO ====="
          find proyecto -maxdepth 6 -type f | sort

      - name: Corregir MainActivity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path(
              "proyecto/SPmusic_1_0/app/src/main/java/com/spmusic/app/MainActivity.java"
          )

          text = file.read_text()

          if "import androidx.recyclerview.widget.RecyclerView;" not in text:
              lines = text.splitlines()
              imports = [
                  i for i, line in enumerate(lines)
                  if line.startswith("import ")
              ]

              if imports:
                  lines.insert(
                      max(imports) + 1,
                      "import androidx.recyclerview.widget.RecyclerView;"
                  )

              text = "\n".join(lines) + "\n"

          text = text.replace(
              "void play(Song s)",
              "public void play(Song s)"
          )

          text = text.replace(
              "}},Runnable::run);updateMini();",
              "}});updateMini();"
          )

          file.write_text(text)

          print("MainActivity.java corregido.")
          PY

      - name: Crear tema compatible
        run: |
          mkdir -p proyecto/SPmusic_1_0/app/src/main/res/values

          cat > proyecto/SPmusic_1_0/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#3F51B5</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>

          </resources>
          EOF

      - name: Corregir AndroidManifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          file = Path(
              "proyecto/SPmusic_1_0/app/src/main/AndroidManifest.xml"
          )

          text = file.read_text()

          text = re.sub(
              r'android:theme="[^"]*"',
              'android:theme="@style/AppTheme"',
              text
          )

          file.write_text(text)

          print("AndroidManifest.xml corregido.")
          PY

      - name: Corregir recursos XML
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("proyecto/SPmusic_1_0/app/src/main/res")

          for file in root.rglob("*.xml"):
              text = file.read_text()

              text = text.replace(
                  "android:hintTextColor",
                  "android:textColorHint"
              )

              file.write_text(text)

          print("Recursos XML corregidos.")
          PY

      - name: Crear pantalla de diagnóstico
        run: |
          mkdir -p proyecto/SPmusic_1_0/app/src/main/java/com/spmusic/app

          cat > proyecto/SPmusic_1_0/app/src/main/java/com/spmusic/app/CrashActivity.java <<'EOF'
          package com.spmusic.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.text.method.ScrollingMovementMethod;

          public class CrashActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  String error = getIntent().getStringExtra("error");

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(32, 32, 32, 32);
                  layout.setGravity(Gravity.CENTER);

                  TextView title = new TextView(this);
                  title.setText("SPmusic encontró un error");
                  title.setTextSize(24);
                  title.setTextColor(Color.BLACK);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(0, 0, 0, 24);

                  TextView details = new TextView(this);
                  details.setText(error == null ? "Error desconocido." : error);
                  details.setTextSize(14);
                  details.setTextColor(Color.DKGRAY);
                  details.setMovementMethod(new ScrollingMovementMethod());

                  layout.addView(title);
                  layout.addView(details);

                  setContentView(layout);
              }
          }
          EOF

          echo "CrashActivity creada."

      - name: Agregar diagnóstico de errores
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path(
              "proyecto/SPmusic_1_0/app/src/main/java/com/spmusic/app/MainActivity.java"
          )

          text = file.read_text()

          marker = "public class MainActivity"

          if "SPMUSIC_CRASH_HANDLER" not in text and marker in text:

              start = text.index(marker)
              brace = text.index("{", start) + 1

              handler = r'''

              // SPMUSIC_CRASH_HANDLER
              private void instalarManejadorDeErrores() {
                  Thread.setDefaultUncaughtExceptionHandler((thread, throwable) -> {
                      try {
                          StringBuilder error = new StringBuilder();
                          error.append("Hilo: ")
                               .append(thread.getName())
                               .append("\n\n");
                          error.append(throwable.toString())
                               .append("\n\n");

                          for (StackTraceElement element : throwable.getStackTrace()) {
                              error.append("at ")
                                   .append(element.toString())
                                   .append("\n");
                          }

                          android.content.Intent intent =
                              new android.content.Intent(this, CrashActivity.class);

                          intent.putExtra("error", error.toString());
                          intent.addFlags(
                              android.content.Intent.FLAG_ACTIVITY_NEW_TASK |
                              android.content.Intent.FLAG_ACTIVITY_CLEAR_TOP
                          );

                          startActivity(intent);

                          try {
                              Thread.sleep(1500);
                          } catch (InterruptedException ignored) {
                          }

                      } catch (Exception ignored) {
                      }

                      android.os.Process.killProcess(
                          android.os.Process.myPid()
                      );
                  });
              }
              '''

              text = text[:brace] + handler + text[brace:]

              on_create = "protected void onCreate(Bundle savedInstanceState)"
              pos = text.find(on_create)

              if pos != -1:
                  body = text.find("{", pos)

                  if body != -1:
                      text = (
                          text[:body + 1]
                          + "\n        instalarManejadorDeErrores();\n"
                          + text[body + 1:]
                      )

              file.write_text(text)

          print("Manejador de errores instalado.")
          PY

      - name: Agregar CrashActivity al Manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path(
              "proyecto/SPmusic_1_0/app/src/main/AndroidManifest.xml"
          )

          text = file.read_text()

          activity = '<activity android:name=".CrashActivity" />'

          if "CrashActivity" not in text:
              position = text.rfind("</application>")

              if position != -1:
                  text = (
                      text[:position]
                      + "        "
                      + activity
                      + "\n"
                      + text[position:]
                  )

          file.write_text(text)

          print("CrashActivity agregada al Manifest.")
          PY

      - name: Verificar proyecto
        run: |
          echo "===== MAIN ACTIVITY ====="
          grep -n "SPMUSIC_CRASH_HANDLER" \
            proyecto/SPmusic_1_0/app/src/main/java/com/spmusic/app/MainActivity.java || true

          echo "===== CRASH ACTIVITY ====="
          ls -l \
            proyecto/SPmusic_1_0/app/src/main/java/com/spmusic/app/CrashActivity.java

          echo "===== MANIFEST ====="
          cat proyecto/SPmusic_1_0/app/src/main/AndroidManifest.xml

      - name: Compilar SPmusic
        run: |
          cd proyecto/SPmusic_1_0
          gradle assembleDebug

      - name: Buscar APK
        run: |
          echo "===== APK GENERADO ====="
          find proyecto -name "*.apk" -type f

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: SPmusic-APK-Diagnostico
          path: proyecto/**/build/outputs/apk/debug/*.apk
