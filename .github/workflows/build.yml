name: Compilar SPmusic

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Descomprimir SPmusic
        run: |
          unzip -o SPmusic_1_0_fuente_completa.zip -d proyecto

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Buscar proyecto
        run: |
          echo "===== CONTENIDO DEL PROYECTO ====="
          find proyecto -maxdepth 5 -type f | sort

      - name: Corregir MainActivity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path(
              "proyecto/SPmusic_1_0/app/src/main/java/com/spmusic/app/MainActivity.java"
          )

          text = file.read_text()

          if "import androidx.recyclerview.widget.RecyclerView;" not in text:
              lines = text.splitlines()
              imports = [
                  i for i, line in enumerate(lines)
                  if line.startswith("import ")
              ]

              if imports:
                  lines.insert(
                      max(imports) + 1,
                      "import androidx.recyclerview.widget.RecyclerView;"
                  )

              text = "\n".join(lines) + "\n"

          text = text.replace(
              "void play(Song s)",
              "public void play(Song s)"
          )

          text = text.replace(
              "}},Runnable::run);updateMini();",
              "}});updateMini();"
          )

          file.write_text(text)

          print("MainActivity.java corregido.")
          PY

      - name: Corregir tema Android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("proyecto/SPmusic_1_0/app/src/main")

          print("===== BUSCANDO TEMA PROBLEMÁTICO =====")

          for file in root.rglob("*.xml"):
              text = file.read_text()

              if "Theme.Material.NoActionBar" in text:
                  print(f"Corrigiendo: {file}")

                  text = text.replace(
                      "@style/Theme.Material.NoActionBar",
                      "@android:style/Theme.Material.Light.NoActionBar"
                  )

                  text = text.replace(
                      "style/Theme.Material.NoActionBar",
                      "android:style/Theme.Material.Light.NoActionBar"
                  )

                  text = text.replace(
                      "Theme.Material.NoActionBar",
                      "Theme.Material.Light.NoActionBar"
                  )

                  file.write_text(text)

          print("===== TEMAS CORREGIDOS =====")
          PY

      - name: Verificar AndroidManifest
        run: |
          echo "===== ANDROID MANIFEST ====="
          cat proyecto/SPmusic_1_0/app/src/main/AndroidManifest.xml
          echo "===== FIN MANIFEST ====="

      - name: Verificar temas XML
        run: |
          echo "===== TEMAS ====="
          find proyecto/SPmusic_1_0/app/src/main/res -type f -name "*.xml" -print -exec grep -n "Theme" {} \; || true
          echo "===== FIN TEMAS ====="

      - name: Compilar SPmusic
        run: |
          cd proyecto/SPmusic_1_0
          gradle assembleDebug

      - name: Buscar APK
        run: |
          echo "===== APK GENERADO ====="
          find proyecto -name "*.apk" -type f

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: SPmusic-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
