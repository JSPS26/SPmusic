name: Compilar SPmusic

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Descomprimir SPmusic
        run: |
          unzip -o SPmusic_1_0_fuente_completa.zip -d proyecto

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Buscar proyecto
        run: |
          echo "===== CONTENIDO DEL PROYECTO ====="
          find proyecto -maxdepth 5 -type f | sort

      - name: Corregir MainActivity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path(
              "proyecto/SPmusic_1_0/app/src/main/java/com/spmusic/app/MainActivity.java"
          )

          text = file.read_text()

          if "import androidx.recyclerview.widget.RecyclerView;" not in text:
              lines = text.splitlines()
              imports = [
                  i for i, line in enumerate(lines)
                  if line.startswith("import ")
              ]

              if imports:
                  lines.insert(
                      max(imports) + 1,
                      "import androidx.recyclerview.widget.RecyclerView;"
                  )

              text = "\n".join(lines) + "\n"

          text = text.replace(
              "void play(Song s)",
              "public void play(Song s)"
          )

          text = text.replace(
              "}},Runnable::run);updateMini();",
              "}});updateMini();"
          )

          file.write_text(text)

          print("MainActivity.java corregido.")
          PY

      - name: Crear tema compatible
        run: |
          mkdir -p proyecto/SPmusic_1_0/app/src/main/res/values

          cat > proyecto/SPmusic_1_0/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#3F51B5</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>

          </resources>
          EOF

          echo "Tema AppTheme creado."

      - name: Corregir AndroidManifest
        run: |
          MANIFEST="proyecto/SPmusic_1_0/app/src/main/AndroidManifest.xml"

          python3 - <<'PY'
          from pathlib import Path
          import re

          file = Path(
              "proyecto/SPmusic_1_0/app/src/main/AndroidManifest.xml"
          )

          text = file.read_text()

          text = re.sub(
              r'android:theme="[^"]*"',
              'android:theme="@style/AppTheme"',
              text
          )

          file.write_text(text)

          print("AndroidManifest.xml corregido.")
          PY

          echo "===== MANIFEST FINAL ====="
          cat "$MANIFEST"

      - name: Verificar tema
        run: |
          echo "===== themes.xml ====="
          cat proyecto/SPmusic_1_0/app/src/main/res/values/themes.xml

      - name: Compilar SPmusic
        run: |
          cd proyecto/SPmusic_1_0
          gradle assembleDebug

      - name: Buscar APK
        run: |
          echo "===== APK GENERADO ====="
          find proyecto -name "*.apk" -type f

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: SPmusic-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
