name: Compilar SPmusic

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Descomprimir SPmusic
        run: |
          unzip -o SPmusic_1_0_fuente_completa.zip -d proyecto

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Buscar proyecto
        run: |
          echo "Contenido del proyecto:"
          find proyecto -maxdepth 5 -type f | sort

      - name: Corregir MainActivity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          file = Path("proyecto/SPmusic_1_0/app/src/main/java/com/spmusic/app/MainActivity.java")
          text = file.read_text()

          if "import androidx.recyclerview.widget.RecyclerView;" not in text:
              lines = text.splitlines()
              last_import = max(i for i, line in enumerate(lines) if line.startswith("import "))
              lines.insert(last_import + 1, "import androidx.recyclerview.widget.RecyclerView;")
              text = "\n".join(lines) + "\n"

          text = text.replace("void play(Song s)", "public void play(Song s)")

          pattern = r"(controller\.addListener\(new Player\.Listener\{.*?\}\)),Runnable::run\);"
          text = re.sub(pattern, r"\1);", text, flags=re.DOTALL)

          file.write_text(text)

          print("MainActivity.java corregido.")
          PY

      - name: Compilar SPmusic
        run: |
          cd proyecto/SPmusic_1_0
          gradle assembleDebug

      - name: Buscar APK
        run: |
          find proyecto -name "*.apk" -type f

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: SPmusic-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
