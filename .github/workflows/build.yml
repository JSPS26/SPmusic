name: Compilar SPmusic

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Descomprimir SPmusic
        run: |
          unzip -o SPmusic_1_0_fuente_completa.zip -d proyecto

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Buscar proyecto
        run: |
          echo "Contenido del proyecto:"
          find proyecto -maxdepth 5 -type f | sort

      - name: Mostrar MainActivity
        run: |
          echo "===== MAIN ACTIVITY ====="
          cat proyecto/SPmusic_1_0/app/src/main/java/com/spmusic/app/MainActivity.java
          echo "===== FIN MAIN ACTIVITY ====="

      - name: Compilar SPmusic
        run: |
          cd proyecto/SPmusic_1_0
          gradle assembleDebug

      - name: Buscar APK
        run: |
          find proyecto -name "*.apk" -type f

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: SPmusic-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
